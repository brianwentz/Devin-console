name: windows

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      ELECTRON_DISABLE_SECURITY_WARNINGS: 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm audit --audit-level=high

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build

      # Runner display is 1024x768; the 1400x900 test window needs more room.
      # Best-effort raise — the launchApp width check is the real gate.
      # (Also benefits the smoke:install step below.)
      - run: pwsh scripts/ci-display.ps1

      # Playwright drives Electron via _electron.launch (no browser download needed).
      - run: npm run test:e2e

      # NSIS installer (unsigned; fuses flipped by electron-builder from build.electronFuses).
      - run: npm run dist:win

      # Silent per-user install -> smoke -> upgrade-in-place -> smoke -> silent uninstall.
      - run: npm run smoke:install:real
        shell: pwsh

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: agent-workspace-windows-${{ github.sha }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
            docs/evidence/*smoke*

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results-${{ github.sha }}
          if-no-files-found: ignore
          path: test-results/

  # macOS: build + package only — e2e and smoke:install stay Windows-only.
  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm audit --audit-level=high

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build

      - run: npm run dist:mac

      - name: Check artifacts
        run: |
          ls dist/latest-mac.yml
          ls dist/AgentWorkspace-*-arm64.dmg
          ls dist/AgentWorkspace-*-arm64.zip
          ls dist/AgentWorkspace-*-arm64.zip.blockmap
          codesign --verify --deep --strict --verbose=2 "dist/mac-arm64/Agent Workspace.app"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: agent-workspace-macos-${{ github.sha }}
          if-no-files-found: error
          path: |
            dist/latest-mac.yml
            dist/*-arm64.dmg
            dist/*-arm64.zip
            dist/*-arm64.zip.blockmap
