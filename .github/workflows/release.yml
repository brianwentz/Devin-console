name: release

# Publish a GitHub Release with tag `vX.Y.Z` (targeting main) in the GitHub UI.
# This workflow then sets package.json to X.Y.Z, builds the Windows NSIS
# installer and the macOS (arm64) dmg/zip, uploads the installers, blockmaps
# and latest.yml/latest-mac.yml to that release (the feed read by
# src/main/updater.ts), and commits the version bump to main. macOS code
# signing + notarization run only when the CSC_LINK / CSC_KEY_PASSWORD /
# APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID secrets are set;
# unsigned Mac builds are ad-hoc signed (mac.identity "-") and ship with the
# updater disabled. Mark the release as a
# pre-release to ship a build that existing clients will NOT auto-update to
# (electron-updater ignores prereleases by default).
on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate tag
        id: tag
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "tag '$TAG' must match vX.Y.Z"; exit 1; fi
          ver="${TAG#v}"
          git merge-base --is-ancestor "$TAG" main || { echo "tag $TAG is not an ancestor of main"; exit 1; }
          node -e '
            const [tag, cur] = [process.argv[1], require("./package.json").version].map(v => v.split(".").map(Number));
            const i = tag.findIndex((n, idx) => n !== cur[idx]);
            if (i === -1 || tag[i] < cur[i]) {
              console.error(`tag version ${process.argv[1]} must be greater than package.json version ${cur.join(".")}`);
              process.exit(1);
            }
          ' "$ver"
          echo "version=$ver" >> "$GITHUB_OUTPUT"

  windows:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Set package version from tag
        run: npm version ${{ needs.prepare.outputs.version }} --no-git-tag-version

      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build

      # NSIS installer (unsigned; fuses flipped in afterPack). build.publish in
      # package.json still bakes resources/app-update.yml; upload is done below
      # with gh so an already-published release is never skipped.
      - run: npx electron-builder --win nsis --x64 --publish never

      - name: Check artifacts
        shell: pwsh
        run: |
          $ver = '${{ needs.prepare.outputs.version }}'
          foreach ($f in "dist/AgentWorkspace-Setup-$ver.exe", "dist/AgentWorkspace-Setup-$ver.exe.blockmap", "dist/latest.yml") {
            if (-not (Test-Path $f)) { throw "missing $f" }
          }
          $yml = Get-Content dist/latest.yml -Raw
          if ($yml -notmatch "(?m)^version:\s*$([regex]::Escape($ver))\s*$") { throw "dist/latest.yml does not declare version $ver`n$yml" }

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: gh release upload $env:TAG dist/AgentWorkspace-Setup-*.exe dist/AgentWorkspace-Setup-*.exe.blockmap dist/latest.yml --clobber

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: agent-workspace-${{ github.event.release.tag_name }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml

  macos:
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Set package version from tag
        run: npm version ${{ needs.prepare.outputs.version }} --no-git-tag-version

      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build

      # dmg + zip (arm64). Signs and notarizes only when the CSC_* / APPLE_*
      # secrets exist; otherwise an unsigned build with the updater disabled
      # (resources/signing.json written by afterPack inside the bundle).
      - name: Build installer
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CSC_LINK" ]; then
            echo "signing: Developer ID + notarization"
            npx electron-builder --mac --arm64 --publish never -c.mac.notarize=true
          else
            echo "signing: ad-hoc (no Developer ID) — Gatekeeper will require right-click → Open; Mac auto-update disabled"
            # electron-builder treats a *defined* CSC_LINK (even "") as a certificate
            # path; the env block above always defines it, so drop them all here.
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --mac --arm64 --publish never -c.mac.identity=- -c.mac.hardenedRuntime=false
          fi

      - name: Check artifacts
        run: |
          ver='${{ needs.prepare.outputs.version }}'
          for f in "dist/AgentWorkspace-$ver-arm64.dmg" "dist/AgentWorkspace-$ver-arm64.zip" "dist/AgentWorkspace-$ver-arm64.zip.blockmap" "dist/latest-mac.yml"; do
            [ -f "$f" ] || { echo "missing $f"; exit 1; }
          done
          grep -Eq "^version:[[:space:]]*$ver[[:space:]]*$" dist/latest-mac.yml || { echo "dist/latest-mac.yml does not declare version $ver"; cat dist/latest-mac.yml; exit 1; }
          codesign --verify --deep --strict --verbose=2 "dist/mac-arm64/Agent Workspace.app"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" "dist/AgentWorkspace-${{ needs.prepare.outputs.version }}-arm64.dmg" "dist/AgentWorkspace-${{ needs.prepare.outputs.version }}-arm64.zip" "dist/AgentWorkspace-${{ needs.prepare.outputs.version }}-arm64.zip.blockmap" dist/latest-mac.yml --clobber

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: agent-workspace-macos-${{ github.event.release.tag_name }}
          if-no-files-found: error
          path: |
            dist/*-arm64.dmg
            dist/*-arm64.zip
            dist/*-arm64.zip.blockmap
            dist/latest-mac.yml

  finalize:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          names=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          echo "$names"
          for f in latest.yml latest-mac.yml; do
            grep -qx "$f" <<< "$names" || { echo "$f not attached to $TAG"; exit 1; }
          done

      # Only after the release has its assets: record the bump on main.
      - name: Commit version bump to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          npm version "${TAG#v}" --no-git-tag-version
          git add package.json package-lock.json
          git commit -m "chore: release $TAG [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
